[package]
name        = "write_flux"
version     = "0.1.20"
keywords    = ["write_flux", "influxdb", "influxdb2", "reqwest", "rustls", "aws-lc-rs"]
description = "Influxdb2 point client"
edition     = "2021"
license     = "MIT OR Apache-2.0"
authors     = [ "B3K7" ]

[dependencies]
chrono              = "0.4"
clap                = { version = "4.5", features = ["derive"] }
clap-verbosity-flag = "2.2"
env_logger          = "0.11"
log                 = "0.4"
serde               = { version = "1.0", features = ["derive"] }
serde_json          = "1.0"
tokio               = { version = "1.38", features = ["full"] }

# reqwest 0.12+ natively uses rustls 0.22+ and defaults to the aws-lc-rs crypto provider.
# We disable default features to strip out native-tls (OpenSSL).
reqwest             = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
strip = "symbols"
opt-level = "3"
lto = "fat"
codegen-units = 1
target-cpu = "native"
panic = "abort"

